name: Build Nexus 5 postmarketOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build postmarketOS for Nexus 5
    runs-on: ubuntu-24.04
    timeout-minutes: 330

    env:
      DEVICE: lg-hammerhead
      PMB_WORK: /home/runner/.local/var/pmbootstrap
      PMB_APORTS: /home/runner/pmaports
      PMB_CONFIG: /home/runner/.config/pmbootstrap_v3.cfg
      EXPORT_DIR: /home/runner/postmarketos-export

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            python3 \
            openssl \
            ca-certificates \
            qemu-user-static \
            binfmt-support \
            xz-utils \
            zip \
            unzip \
            file \
            rsync

      - name: Install pmbootstrap
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth=1 \
            https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git \
            "$HOME/pmbootstrap"

          mkdir -p "$HOME/.local/bin"

          ln -s \
            "$HOME/pmbootstrap/pmbootstrap.py" \
            "$HOME/.local/bin/pmbootstrap"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          "$HOME/.local/bin/pmbootstrap" --version

      - name: Clone pmaports
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth=1 \
            https://gitlab.postmarketos.org/postmarketOS/pmaports.git \
            "$PMB_APORTS"

          echo "=== pmaports branch ==="
          git -C "$PMB_APORTS" branch --show-current

          echo "=== pmaports revision ==="
          git -C "$PMB_APORTS" rev-parse HEAD

      - name: Check Nexus 5 device support
        shell: bash
        run: |
          set -euo pipefail

          DEVICE_DIR="$PMB_APORTS/device/testing/device-$DEVICE"

          test -f "$DEVICE_DIR/APKBUILD"
          test -f "$DEVICE_DIR/deviceinfo"

          echo "=== Device package ==="

          grep -E \
            '^(pkgname|pkgver|arch|depends)=' \
            "$DEVICE_DIR/APKBUILD"

          echo "=== Device information ==="

          cat "$DEVICE_DIR/deviceinfo"

      - name: Configure pmbootstrap
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$(dirname "$PMB_CONFIG")"

          # IMPORTANT:
          # Do NOT create PMB_WORK manually.
          # pmbootstrap must initialize its work directory itself.
          #
          # An existing empty directory without version metadata
          # can trigger:
          # "Your work folder version needs to be migrated
          #  (from version  to 8)"

          if [ -e "$PMB_WORK" ]; then
            echo "Removing existing work directory..."
            sudo rm -rf "$PMB_WORK"
          fi

          cat > "$PMB_CONFIG" <<EOF
          [pmbootstrap]
          aports = $PMB_APORTS
          work = $PMB_WORK
          device = $DEVICE
          ui = none
          user = user
          hostname = nexus5
          timezone = UTC
          build_default_device_arch = armv7
          is_default_channel = False
          EOF

          echo "=== Configuration ==="
          cat "$PMB_CONFIG"

          echo "=== pmbootstrap version ==="
          pmbootstrap --version

          echo "=== Verify work directory ==="

          if [ -e "$PMB_WORK" ]; then
            echo "::error::Work directory must not exist before initialization"
            exit 1
          fi

          echo "Work directory does not exist (expected)."

          echo "=== pmbootstrap status ==="

          pmbootstrap \
            --config "$PMB_CONFIG" \
            --details-to-stdout \
            status

      - name: Build TWRP Recovery ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Building postmarketOS ==="

          pmbootstrap \
            --config "$PMB_CONFIG" \
            --details-to-stdout \
            -y \
            install \
            --android-recovery-zip \
            --password postmarketos

      - name: Export ROM
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$EXPORT_DIR"

          echo "=== Exporting images ==="

          pmbootstrap \
            --config "$PMB_CONFIG" \
            --details-to-stdout \
            export "$EXPORT_DIR"

          echo "=== Exported files ==="

          find "$EXPORT_DIR" \
            -maxdepth 3 \
            -type f \
            -printf '%p (%s bytes)\n'

          echo "=== Recovery ZIP files ==="

          find "$EXPORT_DIR" \
            -type f \
            -iname '*.zip' \
            -print

          if ! find "$EXPORT_DIR" \
            -type f \
            -iname '*.zip' \
            -print -quit | grep -q .; then

            echo "::error::No recovery ZIP found in export directory"
            exit 1
          fi

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: postmarketos-nexus5-twrp
          path: ${{ env.EXPORT_DIR }}/
          retention-days: 14
          if-no-files-found: error

      - name: Upload debug logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pmbootstrap-debug-logs
          path: |
            /home/runner/.local/var/pmbootstrap/log.txt
            /home/runner/.local/var/pmbootstrap/logs/
            /home/runner/.config/pmbootstrap_v3.cfg
          retention-days: 7
          if-no-files-found: ignore
