name: Build Nexus 5 postmarketOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build postmarketOS for Nexus 5
    runs-on: ubuntu-24.04
    timeout-minutes: 330

    env:
      DEVICE: lg-hammerhead
      PMB_WORK: /home/runner/.local/var/pmbootstrap
      PMB_APORTS: /home/runner/pmaports
      PMB_CONFIG: /home/runner/.config/pmbootstrap_v3.cfg
      EXPORT_DIR: /home/runner/postmarketos-export
      ARTIFACT_DIR: /home/runner/postmarketos-artifacts

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            python3 \
            openssl \
            ca-certificates \
            qemu-user-static \
            binfmt-support \
            xz-utils \
            zip \
            unzip \
            file \
            rsync

      - name: Install pmbootstrap
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth=1 \
            https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git \
            "$HOME/pmbootstrap"

          mkdir -p "$HOME/.local/bin"

          ln -s \
            "$HOME/pmbootstrap/pmbootstrap.py" \
            "$HOME/.local/bin/pmbootstrap"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          "$HOME/.local/bin/pmbootstrap" --version

      - name: Clone pmaports
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth=1 \
            https://gitlab.postmarketos.org/postmarketOS/pmaports.git \
            "$PMB_APORTS"

          echo "=== pmaports branch ==="
          git -C "$PMB_APORTS" branch --show-current

          echo "=== pmaports revision ==="
          git -C "$PMB_APORTS" rev-parse HEAD

      - name: Check Nexus 5 device support
        shell: bash
        run: |
          set -euo pipefail

          DEVICE_DIR="$PMB_APORTS/device/testing/device-$DEVICE"

          test -f "$DEVICE_DIR/APKBUILD"
          test -f "$DEVICE_DIR/deviceinfo"

          echo "=== Device package ==="
          grep -E \
            '^(pkgname|pkgver|arch|depends)=' \
            "$DEVICE_DIR/APKBUILD"

          echo "=== Device information ==="
          cat "$DEVICE_DIR/deviceinfo"

      - name: Initialize pmbootstrap
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$(dirname "$PMB_CONFIG")"

          if [ -e "$PMB_WORK" ]; then
            sudo rm -rf "$PMB_WORK"
          fi

          cat > "$PMB_CONFIG" <<EOF
          [pmbootstrap]
          aports = $PMB_APORTS
          work = $PMB_WORK
          device = $DEVICE
          ui = none
          user = user
          hostname = nexus5
          timezone = UTC
          build_default_device_arch = armv7
          is_default_channel = False
          EOF

          echo "=== Initialize pmbootstrap ==="

          set +o pipefail

          printf '\n%.0s' {1..100} | \
            timeout 180 \
            pmbootstrap \
              --config "$PMB_CONFIG" \
              --aports "$PMB_APORTS" \
              --work "$PMB_WORK" \
              --details-to-stdout \
              init

          result=${PIPESTATUS[1]}

          set -o pipefail

          if [ "$result" -ne 0 ]; then
            echo "::error::pmbootstrap init failed: $result"
            exit "$result"
          fi

          echo "=== Final configuration ==="
          cat "$PMB_CONFIG"

      - name: Verify configuration
        shell: bash
        run: |
          set -euo pipefail

          pmbootstrap \
            --config "$PMB_CONFIG" \
            --details-to-stdout \
            status

          grep -Eq \
            '^device *= *lg-hammerhead *$' \
            "$PMB_CONFIG"

      - name: Build TWRP Recovery ZIP
        shell: bash
        run: |
          set -euo pipefail

          pmbootstrap \
            --config "$PMB_CONFIG" \
            --details-to-stdout \
            --timeout 3600 \
            --assume-yes \
            install \
            --android-recovery-zip \
            --password postmarketos

      - name: Export ROM
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$EXPORT_DIR"
          mkdir -p "$ARTIFACT_DIR"

          echo "=== Export images ==="

          pmbootstrap \
            --config "$PMB_CONFIG" \
            --details-to-stdout \
            export "$EXPORT_DIR"

          echo "=== Export directory ==="

          ls -lah "$EXPORT_DIR"

          echo "=== Copy exported files ==="

          # pmbootstrap export creates symlinks.
          # Dereference them so GitHub Actions uploads real files.
          for name in \
            pmos-lg-hammerhead.zip \
            boot.img \
            lk2nd.img \
            initramfs \
            vmlinuz
          do
            source="$EXPORT_DIR/$name"

            if [ -f "$source" ]; then
              cp -L "$source" "$ARTIFACT_DIR/$name"
              echo "Copied: $name"
            else
              echo "Not available: $name"
            fi
          done

          echo "=== Verify Recovery ZIP ==="

          ZIP_FILE="$ARTIFACT_DIR/pmos-lg-hammerhead.zip"

          if [ ! -s "$ZIP_FILE" ]; then
            echo "::error::Recovery ZIP missing or empty"
            exit 1
          fi

          file "$ZIP_FILE"

          unzip -t "$ZIP_FILE"

          echo "=== ZIP contents ==="

          unzip -l "$ZIP_FILE" | head -80 || true

          echo "=== SHA256 ==="

          (
            cd "$ARTIFACT_DIR"
            sha256sum \
              pmos-lg-hammerhead.zip \
              > SHA256SUMS.txt
          )

          cat "$ARTIFACT_DIR/SHA256SUMS.txt"

          echo "=== Final artifacts ==="

          ls -lah "$ARTIFACT_DIR"

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: postmarketos-lg-hammerhead-twrp
          path: ${{ env.ARTIFACT_DIR }}/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

      - name: Upload debug logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pmbootstrap-debug-logs
          path: |
            /home/runner/.local/var/pmbootstrap/log.txt
            /home/runner/.local/var/pmbootstrap/logs/
            /home/runner/.config/pmbootstrap_v3.cfg
          retention-days: 7
          if-no-files-found: ignore
