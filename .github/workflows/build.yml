name: Build Nexus 5 postmarketOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build postmarketOS for Nexus 5
    runs-on: ubuntu-24.04
    timeout-minutes: 330

    env:
      DEVICE: lg-hammerhead
      PMB_WORK: /home/runner/.local/var/pmbootstrap
      PMB_APORTS: /home/runner/pmaports
      PMB_CONFIG: /home/runner/.config/pmbootstrap_v3.cfg
      EXPORT_DIR: /home/runner/postmarketos-export
      ARTIFACT_DIR: /home/runner/postmarketos-artifacts

      # Nexus 5 System partition:
      # /dev/block/mmcblk0p25 = 1,536,000,512 bytes
      SYSTEM_PARTITION_BYTES: "1536000512"

      # Recovery installer reserves approximately 256 MB for boot.
      # This is a conservative rootfs preflight budget, not the
      # final filesystem capacity.
      ROOTFS_BUDGET_BYTES: "1101004800"

    steps:
      # ------------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------------

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            python3 \
            openssl \
            ca-certificates \
            qemu-user-static \
            binfmt-support \
            xz-utils \
            zip \
            unzip \
            file \
            rsync \
            e2fsprogs \
            util-linux \
            parted

      # ------------------------------------------------------------
      # pmbootstrap
      # ------------------------------------------------------------

      - name: Install pmbootstrap
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth=1 \
            https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git \
            "$HOME/pmbootstrap"

          mkdir -p "$HOME/.local/bin"

          ln -s \
            "$HOME/pmbootstrap/pmbootstrap.py" \
            "$HOME/.local/bin/pmbootstrap"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          "$HOME/.local/bin/pmbootstrap" --version

          echo "=== pmbootstrap revision ==="
          git -C "$HOME/pmbootstrap" rev-parse HEAD

      # ------------------------------------------------------------
      # pmaports
      # ------------------------------------------------------------

      - name: Clone pmaports
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth=1 \
            https://gitlab.postmarketos.org/postmarketOS/pmaports.git \
            "$PMB_APORTS"

          echo "=== pmaports branch ==="
          git -C "$PMB_APORTS" branch --show-current

          echo "=== pmaports revision ==="
          git -C "$PMB_APORTS" rev-parse HEAD

      # ------------------------------------------------------------
      # Device support
      # ------------------------------------------------------------

      - name: Check Nexus 5 device support
        shell: bash
        run: |
          set -euo pipefail

          DEVICE_DIR="$PMB_APORTS/device/testing/device-$DEVICE"

          test -f "$DEVICE_DIR/APKBUILD"
          test -f "$DEVICE_DIR/deviceinfo"

          echo "=== Device package ==="

          grep -E \
            '^(pkgname|pkgver|arch|depends)=' \
            "$DEVICE_DIR/APKBUILD" || true

          echo "=== Device information ==="
          cat "$DEVICE_DIR/deviceinfo"

          echo "=== Wi-Fi related device configuration ==="

          grep -RniE \
            'wifi|wlan|wcn|firmware|ath|regdom' \
            "$DEVICE_DIR" || true

          echo "=== Kernel dependencies ==="

          grep -E \
            'linux-|firmware|wcn|wifi' \
            "$DEVICE_DIR/APKBUILD" || true

      # ------------------------------------------------------------
      # Initialize
      # ------------------------------------------------------------

      - name: Initialize pmbootstrap
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$(dirname "$PMB_CONFIG")"

          if [ -e "$PMB_WORK" ]; then
            sudo rm -rf "$PMB_WORK"
          fi

          cat > "$PMB_CONFIG" <<EOF_CONFIG
          [pmbootstrap]
          aports = $PMB_APORTS
          work = $PMB_WORK
          device = $DEVICE
          ui = none
          user = user
          hostname = nexus5
          timezone = UTC
          build_default_device_arch = armv7
          is_default_channel = False
          EOF_CONFIG

          echo "=== Initialize pmbootstrap ==="

          set +o pipefail

          printf '\n%.0s' {1..100} | \
            timeout 180 \
            pmbootstrap \
              --config "$PMB_CONFIG" \
              --aports "$PMB_APORTS" \
              --work "$PMB_WORK" \
              --details-to-stdout \
              init

          result=${PIPESTATUS[1]}

          set -o pipefail

          if [ "$result" -ne 0 ]; then
            echo "::error::pmbootstrap init failed: $result"
            exit "$result"
          fi

          echo "=== Final configuration ==="
          cat "$PMB_CONFIG"

      # ------------------------------------------------------------
      # Verify configuration
      # ------------------------------------------------------------

      - name: Verify configuration
        shell: bash
        run: |
          set -euo pipefail

          pmbootstrap \
            --config "$PMB_CONFIG" \
            --details-to-stdout \
            status

          grep -Eq \
            '^device *= *lg-hammerhead *$' \
            "$PMB_CONFIG"

          grep -Eq \
            '^ui *= *none *$' \
            "$PMB_CONFIG"

          echo "=== Headless configuration verified ==="

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------

      - name: Build TWRP Recovery ZIP
        shell: bash
        env:
          PMOS_PASSWORD: ${{ secrets.PMOS_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$PMOS_PASSWORD" ]; then
            echo "::error::Set repository Actions secret PMOS_PASSWORD"
            exit 1
          fi

          pmbootstrap \
            --config "$PMB_CONFIG" \
            --details-to-stdout \
            --timeout 3600 \
            --assume-yes \
            install \
            --android-recovery-zip \
            --add iw,wireless-regdb,postmarketos-base-ui-networkmanager,postmarketos-base-ui-wifi-wpa_supplicant \
            --password "$PMOS_PASSWORD"

      # ------------------------------------------------------------
      # Export
      # ------------------------------------------------------------

      - name: Export ROM
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$EXPORT_DIR"
          mkdir -p "$ARTIFACT_DIR"

          echo "=== Export images ==="

          pmbootstrap \
            --config "$PMB_CONFIG" \
            --details-to-stdout \
            export "$EXPORT_DIR"

          echo "=== Export directory ==="
          ls -lah "$EXPORT_DIR"

          echo "=== Copy exported files ==="

          for name in \
            pmos-lg-hammerhead.zip \
            boot.img \
            lk2nd.img \
            initramfs \
            vmlinuz
          do
            source="$EXPORT_DIR/$name"

            if [ -f "$source" ]; then
              cp -L "$source" "$ARTIFACT_DIR/$name"
              echo "Copied: $name"
            else
              echo "Not available: $name"
            fi
          done

          ZIP_FILE="$ARTIFACT_DIR/pmos-lg-hammerhead.zip"

          if [ ! -s "$ZIP_FILE" ]; then
            echo "::error::Recovery ZIP missing or empty"
            exit 1
          fi

          echo "=== Verify Recovery ZIP ==="

          file "$ZIP_FILE"
          unzip -tq "$ZIP_FILE"

          echo "=== ZIP contents ==="
          unzip -l "$ZIP_FILE" | head -80 || true

          echo "=== Recovery installer options ==="

          unzip -p \
            "$ZIP_FILE" \
            chroot/install_options \
            | tee "$ARTIFACT_DIR/install-options.txt"

          if ! grep -Eq \
            "^INSTALL_PARTITION=['\"]?system['\"]?$" \
            "$ARTIFACT_DIR/install-options.txt"; then
            echo "::error::Recovery ZIP is not configured for System partition"
            exit 1
          fi

          echo "=== SHA256 ==="

          (
            cd "$ARTIFACT_DIR"
            sha256sum pmos-lg-hammerhead.zip > SHA256SUMS.txt
          )

          cat "$ARTIFACT_DIR/SHA256SUMS.txt"

      # ------------------------------------------------------------
      # Validate packages and services
      # ------------------------------------------------------------

      - name: Validate Wi-Fi and SSH
        shell: bash
        run: |
          set -euo pipefail

          ROOTFS="$PMB_WORK/chroot_rootfs_$DEVICE"
          INSTALLED_DB="$ROOTFS/lib/apk/db/installed"

          test -s "$INSTALLED_DB"

          echo "=== Installed networking packages ==="

          awk '
            /^P:/ {
              package = substr($0, 3)
              if (package ~ /networkmanager|wpa|wifi|wireless|firmware|openssh|^iw$/)
                print package
            }
          ' "$INSTALLED_DB"

          echo "=== Validate requested packages ==="

          for package in \
            iw \
            wireless-regdb \
            postmarketos-base-ui-networkmanager \
            postmarketos-base-ui-wifi-wpa_supplicant
          do
            if ! grep -Fqx "P:$package" "$INSTALLED_DB"; then
              echo "::error::Missing requested package: $package"
              exit 1
            fi

            echo "Installed: $package"
          done

          echo "=== Validate NetworkManager ==="

          if [ ! -x "$ROOTFS/usr/bin/nmcli" ]; then
            echo "::error::nmcli missing"
            exit 1
          fi

          if [ ! -x "$ROOTFS/usr/sbin/NetworkManager" ]; then
            echo "::error::NetworkManager missing"
            exit 1
          fi

          echo "=== Validate SSH ==="

          if [ ! -x "$ROOTFS/usr/sbin/sshd" ]; then
            echo "::error::sshd missing"
            exit 1
          fi

          echo "=== Validate init system ==="

          if [ -f "$ROOTFS/etc/init.d/networkmanager" ]; then
            echo "OpenRC NetworkManager service found"
          else
            echo "::error::OpenRC NetworkManager service missing"
            exit 1
          fi

          if [ -f "$ROOTFS/etc/init.d/sshd" ]; then
            echo "OpenRC SSH service found"
          else
            echo "::error::OpenRC SSH service missing"
            exit 1
          fi

          echo "=== OpenRC default services ==="

          if [ -d "$ROOTFS/etc/runlevels/default" ]; then
            ls -lah "$ROOTFS/etc/runlevels/default"
          else
            echo "::warning::OpenRC default runlevel directory missing"
          fi

          echo "=== NetworkManager autostart ==="

          if [ -e "$ROOTFS/etc/runlevels/default/networkmanager" ]; then
            echo "NetworkManager enabled"
          else
            echo "::warning::NetworkManager is installed but default autostart was not verified"
          fi

          echo "=== SSH autostart ==="

          if [ -e "$ROOTFS/etc/runlevels/default/sshd" ]; then
            echo "SSH enabled"
          else
            echo "::warning::SSH is installed but default autostart was not verified"
          fi

          echo "=== Wi-Fi configuration ==="

          if [ -d "$ROOTFS/etc/NetworkManager/system-connections" ]; then
            find \
              "$ROOTFS/etc/NetworkManager/system-connections" \
              -maxdepth 1 \
              -type f \
              -printf '%f\n'
          else
            echo "No preconfigured NetworkManager connections"
          fi

          echo "=== Firmware directories ==="

          for directory in \
            "$ROOTFS/lib/firmware" \
            "$ROOTFS/usr/lib/firmware"
          do
            if [ -d "$directory" ]; then
              find "$directory" \
                -type f \
                \( -iname '*wcn*' \
                -o -iname '*wlan*' \
                -o -iname '*prima*' \
                -o -iname '*ath*' \) \
                -print | head -100 || true
            fi
          done

          echo "=== Validation complete ==="

      # ------------------------------------------------------------
      # Rootfs size validation
      # ------------------------------------------------------------

      - name: Validate rootfs size
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$ARTIFACT_DIR/pmos-lg-hammerhead.zip"

          test -s "$ZIP_FILE"

          ROOTFS_CHECK_DIR="$(mktemp -d "$RUNNER_TEMP/hammerhead-rootfs.XXXXXX")"
          ROOTFS_ARCHIVE="$(mktemp "$RUNNER_TEMP/hammerhead-rootfs.XXXXXX.tar.gz")"

          trap 'rm -rf "$ROOTFS_CHECK_DIR"; rm -f "$ROOTFS_ARCHIVE"' EXIT

          echo "=== Extract rootfs archive ==="

          ROOTFS_ENTRY="$(
            unzip -Z1 "$ZIP_FILE" \
              | grep -E '(^|/)rootfs\.tar\.gz$' \
              | head -1
          )"

          if [ -z "$ROOTFS_ENTRY" ]; then
            echo "::error::rootfs.tar.gz not found in Recovery ZIP"
            exit 1
          fi

          echo "Rootfs entry: $ROOTFS_ENTRY"

          unzip -p "$ZIP_FILE" "$ROOTFS_ENTRY" > "$ROOTFS_ARCHIVE"

          gzip -t "$ROOTFS_ARCHIVE"

          echo "=== Extract rootfs ==="

          tar -xzf \
            "$ROOTFS_ARCHIVE" \
            -C "$ROOTFS_CHECK_DIR"

          echo "=== Measure rootfs ==="

          ROOTFS_APPARENT_BYTES="$(
            du --apparent-size -sb "$ROOTFS_CHECK_DIR" \
              | awk '{print $1}'
          )"

          ROOTFS_ALLOCATED_BYTES="$(
            du -sx --block-size=1 "$ROOTFS_CHECK_DIR" \
              | awk '{print $1}'
          )"

          {
            echo "system_partition_bytes=$SYSTEM_PARTITION_BYTES"
            echo "rootfs_budget_bytes=$ROOTFS_BUDGET_BYTES"
            echo "rootfs_apparent_bytes=$ROOTFS_APPARENT_BYTES"
            echo "runner_allocated_bytes=$ROOTFS_ALLOCATED_BYTES"
          } | tee "$ARTIFACT_DIR/rootfs-size.txt"

          if [ "$ROOTFS_APPARENT_BYTES" -gt "$ROOTFS_BUDGET_BYTES" ]; then
            echo "::error::Rootfs exceeds conservative System partition budget"
            exit 1
          fi

          echo "=== Test rootfs on ext4 image ==="

          # Model the installer root partition:
          # System partition minus boot reservation.
          #
          # This test checks whether the extracted rootfs can
          # actually fit on an ext4 filesystem.

          BOOT_RESERVATION_BYTES=256000000

          ROOT_PARTITION_BYTES=$(
            (SYSTEM_PARTITION_BYTES - BOOT_RESERVATION_BYTES)
          )

          echo "Root partition bytes: $ROOT_PARTITION_BYTES"

          EXT4_IMAGE="$RUNNER_TEMP/hammerhead-rootfs-test.ext4"

          truncate \
            -s "$ROOT_PARTITION_BYTES" \
            "$EXT4_IMAGE"

          mkfs.ext4 \
            -F \
            -q \
            -m 0 \
            "$EXT4_IMAGE"

          TEST_MOUNT="$(mktemp -d "$RUNNER_TEMP/hammerhead-mount.XXXXXX")"

          cleanup_mount() {
            sudo umount "$TEST_MOUNT" 2>/dev/null || true
            rmdir "$TEST_MOUNT" 2>/dev/null || true
            rm -f "$EXT4_IMAGE"
          }

          trap 'cleanup_mount; rm -rf "$ROOTFS_CHECK_DIR"; rm -f "$ROOTFS_ARCHIVE"' EXIT

          sudo mount \
            -o loop \
            "$EXT4_IMAGE" \
            "$TEST_MOUNT"

          echo "=== Copy rootfs into ext4 ==="

          sudo rsync \
            -aHAX \
            --numeric-ids \
            "$ROOTFS_CHECK_DIR/" \
            "$TEST_MOUNT/"

          echo "=== ext4 usage ==="

          df -h "$TEST_MOUNT"

          df -B1 "$TEST_MOUNT" \
            | tail -1 \
            | tee "$ARTIFACT_DIR/rootfs-ext4-usage.txt"

          sync

          echo "=== Rootfs fits ext4 test filesystem ==="

      # ------------------------------------------------------------
      # Build metadata
      # ------------------------------------------------------------

      - name: Save build metadata
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "device=$DEVICE"
            echo "ui=none"
            echo "runner=ubuntu-24.04"
            echo "pmbootstrap_revision=$(git -C "$HOME/pmbootstrap" rev-parse HEAD)"
            echo "pmaports_revision=$(git -C "$PMB_APORTS" rev-parse HEAD)"
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$ARTIFACT_DIR/build-info.txt"

          echo "=== Build metadata ==="
          cat "$ARTIFACT_DIR/build-info.txt"

      # ------------------------------------------------------------
      # Upload
      # ------------------------------------------------------------

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: postmarketos-lg-hammerhead-headless
          path: ${{ env.ARTIFACT_DIR }}/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

      # ------------------------------------------------------------
      # Debug logs
      # ------------------------------------------------------------

      - name: Upload debug logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pmbootstrap-debug-logs
          path: |
            /home/runner/.local/var/pmbootstrap/log.txt
            /home/runner/.local/var/pmbootstrap/logs/
            /home/runner/.config/pmbootstrap_v3.cfg
          retention-days: 7
          if-no-files-found: ignore
