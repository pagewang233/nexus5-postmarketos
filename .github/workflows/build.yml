name: Build Nexus 5 postmarketOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build postmarketOS for Nexus 5
    runs-on: ubuntu-24.04
    timeout-minutes: 330

    env:
      DEVICE: lg-hammerhead

      PMB_WORK: /home/runner/.local/var/pmbootstrap
      PMB_APORTS: /home/runner/pmaports
      PMB_CONFIG: /home/runner/.config/pmbootstrap_v3.cfg

      EXPORT_DIR: /home/runner/postmarketos-export
      ARTIFACT_DIR: /home/runner/postmarketos-artifacts

      # Nexus 5 system partition
      SYSTEM_PARTITION_BYTES: "1536000512"

      # Conservative rootfs preflight budget.
      # Actual installer partition layout must still be verified.
      ROOTFS_BUDGET_BYTES: "1101004800"

    steps:

      # ============================================================
      # 1. Dependencies
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            python3 \
            openssl \
            ca-certificates \
            qemu-user-static \
            binfmt-support \
            xz-utils \
            zip \
            unzip \
            file \
            rsync \
            e2fsprogs \
            util-linux \
            parted

      # ============================================================
      # 2. Install pmbootstrap
      # ============================================================

      - name: Install pmbootstrap
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth=1 \
            https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git \
            "$HOME/pmbootstrap"

          mkdir -p "$HOME/.local/bin"

          ln -s \
            "$HOME/pmbootstrap/pmbootstrap.py" \
            "$HOME/.local/bin/pmbootstrap"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          echo "=== pmbootstrap version ==="
          "$HOME/.local/bin/pmbootstrap" --version

          echo "=== pmbootstrap revision ==="
          git -C "$HOME/pmbootstrap" rev-parse HEAD

      # ============================================================
      # 3. Clone pmaports
      # ============================================================

      - name: Clone pmaports
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth=1 \
            https://gitlab.postmarketos.org/postmarketOS/pmaports.git \
            "$PMB_APORTS"

          echo "=== pmaports branch ==="
          git -C "$PMB_APORTS" branch --show-current

          echo "=== pmaports revision ==="
          git -C "$PMB_APORTS" rev-parse HEAD

      # ============================================================
      # 4. Check device support
      # ============================================================

      - name: Check Nexus 5 device support
        shell: bash
        run: |
          set -euo pipefail

          DEVICE_DIR="$PMB_APORTS/device/testing/device-$DEVICE"

          test -f "$DEVICE_DIR/APKBUILD"
          test -f "$DEVICE_DIR/deviceinfo"

          echo "=== Device package ==="

          cat "$DEVICE_DIR/APKBUILD"

          echo "=== Device information ==="

          cat "$DEVICE_DIR/deviceinfo"

          echo "=== Wi-Fi and firmware dependencies ==="

          grep -RniE \
            'wifi|wlan|brcm|cypress|firmware|usb' \
            "$DEVICE_DIR" || true

          echo "=== Kernel dependencies ==="

          grep -E \
            'linux-|firmware|brcm|cypress' \
            "$DEVICE_DIR/APKBUILD" || true

      # ============================================================
      # 5. Initialize pmbootstrap
      # ============================================================

      - name: Initialize pmbootstrap
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$(dirname "$PMB_CONFIG")"

          if [ -e "$PMB_WORK" ]; then
            sudo rm -rf "$PMB_WORK"
          fi

          cat > "$PMB_CONFIG" <<EOF_CONFIG
          [pmbootstrap]
          aports = $PMB_APORTS
          work = $PMB_WORK
          device = $DEVICE
          ui = none
          user = user
          hostname = nexus5
          timezone = UTC
          build_default_device_arch = armv7
          is_default_channel = False
          EOF_CONFIG

          echo "=== Initialize pmbootstrap ==="

          set +o pipefail

          printf '\n%.0s' {1..100} | \
            timeout 180 \
            pmbootstrap \
              --config "$PMB_CONFIG" \
              --aports "$PMB_APORTS" \
              --work "$PMB_WORK" \
              --details-to-stdout \
              init

          result=${PIPESTATUS[1]}

          set -o pipefail

          if [ "$result" -ne 0 ]; then
            echo "::error::pmbootstrap init failed: $result"
            exit "$result"
          fi

          echo "=== Final configuration ==="

          cat "$PMB_CONFIG"

      # ============================================================
      # 6. Verify configuration
      # ============================================================

      - name: Verify configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "=== pmbootstrap status ==="

          STATUS_OUTPUT="$(
            pmbootstrap \
              --config "$PMB_CONFIG" \
              --details-to-stdout \
              status
          )"

          printf '%s\n' "$STATUS_OUTPUT"

          grep -Eq \
            '^device *= *lg-hammerhead *$' \
            "$PMB_CONFIG"

          grep -Eq \
            '^ui *= *none *$' \
            "$PMB_CONFIG"

          echo "=== Verify systemd ==="

          if ! printf '%s\n' "$STATUS_OUTPUT" \
            | grep -Eq 'systemd: yes|systemd.*yes'; then
            echo "::error::Expected systemd-based postmarketOS"
            exit 1
          fi

          echo "=== Configuration verified ==="

      # ============================================================
      # 7. Build TWRP Recovery ZIP
      # ============================================================

      - name: Build TWRP Recovery ZIP
        shell: bash
        env:
          PMOS_PASSWORD: "nexus5"
        run: |
          set -euo pipefail

          echo "=== Build Nexus 5 headless ROM ==="

          pmbootstrap \
            --config "$PMB_CONFIG" \
            --details-to-stdout \
            --timeout 3600 \
            --assume-yes \
            install \
            --android-recovery-zip \
            --add iw,wireless-regdb,postmarketos-base-ui-networkmanager,postmarketos-base-ui-wifi-wpa_supplicant \
            --password "$PMOS_PASSWORD"

          echo "=== Build completed ==="

      # ============================================================
      # 8. Export ROM
      # ============================================================

      - name: Export ROM
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$EXPORT_DIR"
          mkdir -p "$ARTIFACT_DIR"

          echo "=== Export images ==="

          pmbootstrap \
            --config "$PMB_CONFIG" \
            --details-to-stdout \
            export "$EXPORT_DIR"

          echo "=== Export directory ==="

          ls -lah "$EXPORT_DIR"

          echo "=== Copy exported files ==="

          for name in \
            pmos-lg-hammerhead.zip \
            boot.img \
            lk2nd.img \
            initramfs \
            vmlinuz
          do
            source="$EXPORT_DIR/$name"

            if [ -f "$source" ]; then
              cp -L "$source" "$ARTIFACT_DIR/$name"
              echo "Copied: $name"
            else
              echo "Not available: $name"
            fi
          done

          ZIP_FILE="$ARTIFACT_DIR/pmos-lg-hammerhead.zip"

          if [ ! -s "$ZIP_FILE" ]; then
            echo "::error::Recovery ZIP missing or empty"
            exit 1
          fi

          echo "=== Verify Recovery ZIP ==="

          file "$ZIP_FILE"

          unzip -tq "$ZIP_FILE"

          echo "=== ZIP contents ==="

          unzip -l "$ZIP_FILE" | head -80 || true

          echo "=== Recovery installer files ==="

          unzip -Z1 "$ZIP_FILE" \
            | grep -Ei \
              'install_options|updater|rootfs|boot.img|partition' \
            || true

          echo "=== Export install options ==="

          if unzip -Z1 "$ZIP_FILE" \
            | grep -Fxq 'chroot/install_options'; then

            unzip -p \
              "$ZIP_FILE" \
              chroot/install_options \
              > "$ARTIFACT_DIR/install-options.txt"

            cat "$ARTIFACT_DIR/install-options.txt"

            if grep -Eq \
              "^INSTALL_PARTITION=['\"]?data['\"]?$" \
              "$ARTIFACT_DIR/install-options.txt"; then
              echo "::error::Recovery ZIP targets userdata"
              exit 1
            fi

          else
            echo "::warning::install_options not found at expected path"
          fi

          echo "=== SHA256 ==="

          (
            cd "$ARTIFACT_DIR"
            sha256sum pmos-lg-hammerhead.zip > SHA256SUMS.txt
          )

          cat "$ARTIFACT_DIR/SHA256SUMS.txt"

          echo "=== Final artifacts ==="

          ls -lah "$ARTIFACT_DIR"

      # ============================================================
      # 9. Validate Wi-Fi, SSH and systemd
      # ============================================================

      - name: Validate Wi-Fi and SSH
        shell: bash
        run: |
          set -euo pipefail

          ROOTFS="$PMB_WORK/chroot_rootfs_$DEVICE"
          INSTALLED_DB="$ROOTFS/lib/apk/db/installed"

          test -s "$INSTALLED_DB"

          echo "=== Installed networking packages ==="

          awk '
            /^P:/ {
              package = substr($0, 3)
              if (package ~ /networkmanager|wpa|wifi|wireless|firmware|openssh|^iw$/)
                print package
            }
          ' "$INSTALLED_DB"

          echo "=== Validate requested packages ==="

          for package in \
            iw \
            wireless-regdb \
            postmarketos-base-ui-networkmanager \
            postmarketos-base-ui-wifi-wpa_supplicant
          do
            if ! grep -Fqx "P:$package" "$INSTALLED_DB"; then
              echo "::error::Missing package: $package"
              exit 1
            fi

            echo "Installed: $package"
          done

          echo "=== Validate NetworkManager ==="

          test -x "$ROOTFS/usr/bin/nmcli"

          test -x "$ROOTFS/usr/sbin/NetworkManager"

          echo "NetworkManager binaries found."

          echo "=== Validate SSH ==="

          test -x "$ROOTFS/usr/sbin/sshd"

          echo "SSH binary found."

          echo "=== Validate systemd ==="

          test -d "$ROOTFS/usr/lib/systemd/system"

          echo "=== NetworkManager unit ==="

          NM_UNIT="$ROOTFS/usr/lib/systemd/system/NetworkManager.service"

          if [ ! -f "$NM_UNIT" ]; then
            echo "::error::NetworkManager systemd unit missing"
            exit 1
          fi

          echo "NetworkManager unit found."

          echo "=== SSH unit ==="

          SSH_UNIT=""

          for unit in \
            "$ROOTFS/usr/lib/systemd/system/sshd.service" \
            "$ROOTFS/usr/lib/systemd/system/ssh.service"
          do
            if [ -f "$unit" ]; then
              SSH_UNIT="$unit"
              break
            fi
          done

          if [ -z "$SSH_UNIT" ]; then
            echo "::error::SSH systemd unit missing"
            exit 1
          fi

          echo "SSH unit found: $SSH_UNIT"

          echo "=== Enabled systemd services ==="

          if [ -d "$ROOTFS/etc/systemd/system" ]; then

            find "$ROOTFS/etc/systemd/system" \
              -type l \
              \( -iname '*networkmanager*' \
              -o -iname '*ssh*' \) \
              -print || true

          fi

          echo "=== NetworkManager autostart ==="

          if [ -e \
            "$ROOTFS/etc/systemd/system/multi-user.target.wants/NetworkManager.service" \
          ]; then
            echo "NetworkManager enabled"
          else
            echo "::warning::NetworkManager autostart not verified"
          fi

          echo "=== SSH autostart ==="

          if [ -e \
            "$ROOTFS/etc/systemd/system/multi-user.target.wants/sshd.service" \
          ] || [ -e \
            "$ROOTFS/etc/systemd/system/multi-user.target.wants/ssh.service" \
          ]; then
            echo "SSH enabled"
          else
            echo "::warning::SSH autostart not verified"
          fi

          echo "=== USB networking packages ==="

          awk '
            /^P:/ {
              package = substr($0, 3)
              if (package ~ /usb-moded|usb-gadget|r8152|rndis/)
                print package
            }
          ' "$INSTALLED_DB"

          echo "=== Wi-Fi firmware packages ==="

          for package in \
            firmware-lg-hammerhead \
            linux-firmware-brcm \
            linux-firmware-cypress
          do
            if grep -Fqx "P:$package" "$INSTALLED_DB"; then
              echo "Installed: $package"
            else
              echo "::warning::Firmware package not found: $package"
            fi
          done

          echo "=== Wi-Fi firmware files ==="

          for directory in \
            "$ROOTFS/lib/firmware" \
            "$ROOTFS/usr/lib/firmware"
          do
            if [ -d "$directory" ]; then

              find "$directory" \
                \( -type f -o -type l \) \
                \( -iname '*brcm*' \
                -o -iname '*bcm*' \
                -o -iname '*wlan*' \
                -o -iname '*wcn*' \
                -o -iname '*cypress*' \) \
                -print | head -100 || true

            fi
          done

          echo "=== NetworkManager connections ==="

          NM_CONNECTION_DIR="$ROOTFS/etc/NetworkManager/system-connections"

          if [ -d "$NM_CONNECTION_DIR" ]; then
            find "$NM_CONNECTION_DIR" \
              -maxdepth 1 \
              -type f \
              -printf '%f\n'
          else
            echo "No preconfigured Wi-Fi connections"
          fi

          echo "=== Validation complete ==="

      # ============================================================
      # 10. Validate rootfs size
      # ============================================================

      - name: Validate rootfs size
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$ARTIFACT_DIR/pmos-lg-hammerhead.zip"

          test -s "$ZIP_FILE"

          ROOTFS_CHECK_DIR="$RUNNER_TEMP/hammerhead-rootfs"
          ROOTFS_ARCHIVE="$RUNNER_TEMP/hammerhead-rootfs.tar.gz"

          mkdir -p "$ROOTFS_CHECK_DIR"

          echo "=== Locate rootfs archive ==="

          ROOTFS_ENTRY="$(
            unzip -Z1 "$ZIP_FILE" \
              | grep -E '(^|/)rootfs\.tar\.gz$' \
              | head -1 || true
          )"

          if [ -z "$ROOTFS_ENTRY" ]; then
            echo "::error::rootfs.tar.gz not found in Recovery ZIP"
            exit 1
          fi

          echo "Rootfs entry: $ROOTFS_ENTRY"

          echo "=== Extract rootfs archive ==="

          unzip -p \
            "$ZIP_FILE" \
            "$ROOTFS_ENTRY" \
            > "$ROOTFS_ARCHIVE"

          gzip -t "$ROOTFS_ARCHIVE"

          echo "=== Extract rootfs ==="

          sudo tar \
            --numeric-owner \
            -xzf "$ROOTFS_ARCHIVE" \
            -C "$ROOTFS_CHECK_DIR"

          echo "=== Measure rootfs ==="

          ROOTFS_APPARENT_BYTES="$(
            sudo du \
              --apparent-size \
              -sb "$ROOTFS_CHECK_DIR" \
              | awk '{print $1}'
          )"

          ROOTFS_ALLOCATED_BYTES="$(
            sudo du \
              -sx \
              --block-size=1 \
              "$ROOTFS_CHECK_DIR" \
              | awk '{print $1}'
          )"

          {
            echo "system_partition_bytes=$SYSTEM_PARTITION_BYTES"
            echo "rootfs_budget_bytes=$ROOTFS_BUDGET_BYTES"
            echo "rootfs_apparent_bytes=$ROOTFS_APPARENT_BYTES"
            echo "runner_allocated_bytes=$ROOTFS_ALLOCATED_BYTES"
          } | tee "$ARTIFACT_DIR/rootfs-size.txt"

          echo "=== Conservative budget check ==="

          if [ "$ROOTFS_APPARENT_BYTES" -gt "$ROOTFS_BUDGET_BYTES" ]; then

            echo "::warning::Rootfs exceeds conservative budget"
            echo "::warning::Actual filesystem test will determine whether it fits"

          else

            echo "Rootfs is within conservative budget."

          fi

          echo "=== Calculate test root partition ==="

          # Conservative estimate only.
          # Real recovery installer layout must be inspected separately.

          BOOT_RESERVATION_BYTES=536870912

          ROOT_PARTITION_BYTES=$((
            SYSTEM_PARTITION_BYTES - BOOT_RESERVATION_BYTES
          ))

          if [ "$ROOT_PARTITION_BYTES" -le 0 ]; then
            echo "::error::Invalid root partition size"
            exit 1
          fi

          echo "System partition: $SYSTEM_PARTITION_BYTES bytes"
          echo "Boot reservation: $BOOT_RESERVATION_BYTES bytes"
          echo "Root test partition: $ROOT_PARTITION_BYTES bytes"

          echo "=== Create ext4 test image ==="

          EXT4_IMAGE="$RUNNER_TEMP/hammerhead-rootfs-test.ext4"
          TEST_MOUNT="$RUNNER_TEMP/hammerhead-ext4-mount"

          mkdir -p "$TEST_MOUNT"

          truncate \
            -s "$ROOT_PARTITION_BYTES" \
            "$EXT4_IMAGE"

          mkfs.ext4 \
            -F \
            -q \
            -m 0 \
            "$EXT4_IMAGE"

          cleanup() {
            sudo umount "$TEST_MOUNT" 2>/dev/null || true
          }

          trap cleanup EXIT

          echo "=== Mount ext4 image ==="

          sudo mount \
            -o loop \
            "$EXT4_IMAGE" \
            "$TEST_MOUNT"

          echo "=== Copy rootfs into ext4 ==="

          if ! sudo rsync \
            -aHAX \
            --numeric-ids \
            "$ROOTFS_CHECK_DIR/" \
            "$TEST_MOUNT/"; then

            echo "::error::Rootfs does not fit simulated ext4 partition"
            exit 1

          fi

          echo "=== ext4 usage ==="

          df -h "$TEST_MOUNT"

          df -B1 "$TEST_MOUNT" \
            | tail -1 \
            | tee "$ARTIFACT_DIR/rootfs-ext4-usage.txt"

          sync

          echo "=== ext4 validation passed ==="

          sudo umount "$TEST_MOUNT"

          trap - EXIT

      # ============================================================
      # 11. Build metadata
      # ============================================================

      - name: Save build metadata
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "device=$DEVICE"
            echo "ui=none"
            echo "init_system=systemd"
            echo "runner=ubuntu-24.04"

            echo "pmbootstrap_revision=$(
              git -C "$HOME/pmbootstrap" rev-parse HEAD
            )"

            echo "pmaports_revision=$(
              git -C "$PMB_APORTS" rev-parse HEAD
            )"

            echo "build_time=$(
              date -u +%Y-%m-%dT%H:%M:%SZ
            )"

          } > "$ARTIFACT_DIR/build-info.txt"

          echo "=== Build metadata ==="

          cat "$ARTIFACT_DIR/build-info.txt"

      # ============================================================
      # 12. Upload ROM
      # ============================================================

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: postmarketos-lg-hammerhead-headless
          path: ${{ env.ARTIFACT_DIR }}/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

      # ============================================================
      # 13. Upload debug logs
      # ============================================================

      - name: Upload debug logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pmbootstrap-debug-logs
          path: |
            /home/runner/.local/var/pmbootstrap/log.txt
            /home/runner/.local/var/pmbootstrap/logs/
            /home/runner/.config/pmbootstrap_v3.cfg
          retention-days: 7
          if-no-files-found: ignore
