name: Build Nexus 5 postmarketOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build postmarketOS for Nexus 5
    runs-on: ubuntu-24.04
    timeout-minutes: 330

    env:
      DEVICE: lg-hammerhead
      PMB_WORK: /home/runner/.local/var/pmbootstrap
      PMB_APORTS: /home/runner/pmaports
      PMB_CONFIG: /home/runner/.config/pmbootstrap_v3.cfg
      EXPORT_DIR: /home/runner/postmarketos-export

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            git \
            python3 \
            openssl \
            ca-certificates \
            qemu-user-static \
            binfmt-support \
            xz-utils \
            zip \
            unzip \
            file \
            rsync

      - name: Install pmbootstrap
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth=1 \
            https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git \
            "$HOME/pmbootstrap"

          mkdir -p "$HOME/.local/bin"

          ln -s \
            "$HOME/pmbootstrap/pmbootstrap.py" \
            "$HOME/.local/bin/pmbootstrap"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          "$HOME/.local/bin/pmbootstrap" --version

      - name: Clone pmaports
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth=1 \
            https://gitlab.postmarketos.org/postmarketOS/pmaports.git \
            "$PMB_APORTS"

          echo "=== pmaports branch ==="
          git -C "$PMB_APORTS" branch --show-current

          echo "=== pmaports revision ==="
          git -C "$PMB_APORTS" rev-parse HEAD

      - name: Validate Nexus 5 device
        shell: bash
        run: |
          set -euo pipefail

          DEVICE_DIR="$PMB_APORTS/device/testing/device-$DEVICE"

          test -f "$DEVICE_DIR/APKBUILD"
          test -f "$DEVICE_DIR/deviceinfo"

          echo "=== Device package ==="
          grep -E \
            '^(pkgname|pkgver|arch|depends)=' \
            "$DEVICE_DIR/APKBUILD"

          echo "=== Device information ==="
          cat "$DEVICE_DIR/deviceinfo"

      - name: Configure pmbootstrap
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$(dirname "$PMB_CONFIG")"
          mkdir -p "$PMB_WORK"

          cat > "$PMB_CONFIG" <<EOF
          [pmbootstrap]
          aports = $PMB_APORTS
          work = $PMB_WORK
          device = $DEVICE
          ui = none
          user = user
          hostname = nexus5
          timezone = UTC
          build_default_device_arch = armv7
          is_default_channel = False
          EOF

          echo "=== Configuration ==="
          cat "$PMB_CONFIG"

          echo "=== pmbootstrap version ==="
          pmbootstrap --version

          echo "=== pmbootstrap status ==="
          pmbootstrap \
            --config "$PMB_CONFIG" \
            --details-to-stdout \
            status

      - name: Build TWRP recovery ZIP
        shell: bash
        run: |
          set -euo pipefail

          pmbootstrap \
            --config "$PMB_CONFIG" \
            --details-to-stdout \
            -y \
            install \
            --android-recovery-zip \
            --password postmarketos

      - name: Export images
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$EXPORT_DIR"

          pmbootstrap \
            --config "$PMB_CONFIG" \
            --details-to-stdout \
            export "$EXPORT_DIR"

          echo "=== Exported files ==="

          find "$EXPORT_DIR" \
            -maxdepth 3 \
            -type f \
            -printf '%p (%s bytes)\n'

          echo "=== Recovery ZIP files ==="

          find "$EXPORT_DIR" \
            -type f \
            -iname '*.zip' \
            -print

          if ! find "$EXPORT_DIR" \
            -type f \
            -iname '*.zip' \
            -print -quit | grep -q .; then

            echo "::error::No recovery ZIP was exported"
            exit 1
          fi

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: nexus5-postmarketos-twrp
          path: /home/runner/postmarketos-export/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload debug logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pmbootstrap-debug-logs
          path: |
            /home/runner/.local/var/pmbootstrap/log.txt
            /home/runner/.local/var/pmbootstrap/logs/
            /home/runner/.config/pmbootstrap_v3.cfg
          if-no-files-found: ignore
          retention-days: 7
