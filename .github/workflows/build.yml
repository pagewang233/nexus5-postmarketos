name: Build Nexus 5 postmarketOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build postmarketOS for Nexus 5
    runs-on: ubuntu-24.04
    timeout-minutes: 330

    env:
      DEVICE: lg-hammerhead
      PMB_WORK: /home/runner/.local/var/pmbootstrap
      PMB_APORTS: /home/runner/pmaports
      PMB_CONFIG: /home/runner/.config/pmbootstrap_v3.cfg
      EXPORT_DIR: /home/runner/postmarketos-export

    steps:
      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            python3 \
            openssl \
            ca-certificates \
            qemu-user-static \
            binfmt-support \
            xz-utils \
            zip \
            unzip \
            file \
            rsync \
            expect

      - name: Install pmbootstrap
        run: |
          set -euo pipefail

          git clone --depth=1 \
            https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git \
            "$HOME/pmbootstrap"

          mkdir -p "$HOME/.local/bin"

          ln -s \
            "$HOME/pmbootstrap/pmbootstrap.py" \
            "$HOME/.local/bin/pmbootstrap"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Clone pmaports
        run: |
          set -euo pipefail

          git clone --depth=1 \
            https://gitlab.postmarketos.org/postmarketOS/pmaports.git \
            "$PMB_APORTS"

          echo "=== pmaports branch ==="
          git -C "$PMB_APORTS" branch --show-current

          echo "=== pmaports revision ==="
          git -C "$PMB_APORTS" rev-parse HEAD

      - name: Validate Nexus 5 device
        run: |
          set -euo pipefail

          DEVICE_DIR="$PMB_APORTS/device/testing/device-$DEVICE"

          test -f "$DEVICE_DIR/APKBUILD"
          test -f "$DEVICE_DIR/deviceinfo"

          echo "=== Device package ==="
          grep -E \
            '^(pkgname|pkgver|arch|depends)=' \
            "$DEVICE_DIR/APKBUILD"

          echo "=== Device information ==="
          cat "$DEVICE_DIR/deviceinfo"

      - name: Initialize pmbootstrap
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$(dirname "$PMB_CONFIG")"

          # GitHub Actions 每次使用全新环境。
          # 不提前创建空工作目录，避免版本迁移错误。
          rm -rf "$PMB_WORK"

          cat > "$PMB_CONFIG" <<EOF
          [pmbootstrap]
          aports = $PMB_APORTS
          work = $PMB_WORK
          device = $DEVICE
          user = user
          hostname = nexus5
          timezone = UTC
          EOF

          echo "=== pmbootstrap version ==="
          pmbootstrap --version

          # pmbootstrap init 需要交互输入。
          # 使用 expect 自动接受默认值，并为设备选择提供输入。
          cat > /tmp/pmbootstrap-init.exp <<'EXPECT'
          #!/usr/bin/expect -f

          set timeout 300
          log_user 1

          spawn pmbootstrap --config $env(PMB_CONFIG) init

          expect {
            -re {Work path.*:} {
              send "\r"
              exp_continue
            }

            -re {Channel.*:} {
              send "\r"
              exp_continue
            }

            -re {Vendor.*:} {
              send "lg\r"
              exp_continue
            }

            -re {Device codename.*:} {
              send "hammerhead\r"
              exp_continue
            }

            -re {Device.*:} {
              send "hammerhead\r"
              exp_continue
            }

            -re {Username.*:} {
              send "user\r"
              exp_continue
            }

            -re {User interface.*:} {
              send "\r"
              exp_continue
            }

            -re {UI.*:} {
              send "\r"
              exp_continue
            }

            -re {Continue.*:} {
              send "\r"
              exp_continue
            }

            -re {\[[^\]]*\]:} {
              send "\r"
              exp_continue
            }

            timeout {
              puts stderr "ERROR: pmbootstrap init timed out"
              exit 1
            }

            eof
          }

          catch wait result
          set exit_code [lindex $result 3]
          exit $exit_code
          EXPECT

          chmod +x /tmp/pmbootstrap-init.exp

          /tmp/pmbootstrap-init.exp

          echo "=== pmbootstrap status ==="
          pmbootstrap \
            --config "$PMB_CONFIG" \
            status

      - name: Build TWRP recovery ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Building postmarketOS ==="

          pmbootstrap \
            --config "$PMB_CONFIG" \
            --details-to-stdout \
            install \
            --android-recovery-zip

      - name: Export images
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$EXPORT_DIR"

          pmbootstrap \
            --config "$PMB_CONFIG" \
            export "$EXPORT_DIR"

          echo "=== Exported files ==="

          find "$EXPORT_DIR" \
            -maxdepth 3 \
            -type f \
            -printf '%p %s bytes\n'

          echo "=== ZIP files ==="

          find "$EXPORT_DIR" \
            -type f \
            -iname '*.zip' \
            -print

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: nexus5-postmarketos
          path: /home/runner/postmarketos-export/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload debug logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pmbootstrap-debug-logs
          path: |
            /home/runner/.local/var/pmbootstrap/log.txt
            /home/runner/.local/var/pmbootstrap/logs/
            /home/runner/.config/pmbootstrap_v3.cfg
          if-no-files-found: ignore
          retention-days: 7
