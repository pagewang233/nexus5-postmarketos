name: Build postmarketOS Nexus 5 Headless

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            python3 \
            python3-pip \
            pipx \
            qemu-user-static \
            binfmt-support \
            parted \
            e2fsprogs \
            kpartx \
            xz-utils \
            zstd \
            zip \
            unzip

      - name: Install pmbootstrap
        run: |
          pipx install pmbootstrap
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Clone pmaports
        run: |
          git clone --depth=1 \
            https://gitlab.postmarketos.org/postmarketOS/pmaports.git \
            "$HOME/pmaports"

      - name: Initialize pmbootstrap
        run: |
          pmbootstrap init \
            --non-interactive \
            --aports="$HOME/pmaports" \
            --device=lg-hammerhead \
            --ui=none

      - name: Configure build
        run: |
          pmbootstrap config device lg-hammerhead
          pmbootstrap config ui none

      - name: Install headless system
        run: |
          pmbootstrap install \
            --android-recovery-zip

      - name: Export Recovery ZIP
        run: |
          mkdir -p output
          pmbootstrap export

          find /tmp/postmarketOS-export \
            -maxdepth 2 \
            -type f \
            -name '*.zip' \
            -exec cp {} output/pmos-lg-hammerhead-headless.zip \;

          ls -lh output/

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: postmarketos-lg-hammerhead-headless
          path: output/*.zip
          if-no-files-found: error
