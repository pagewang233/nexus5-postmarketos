name: Build Nexus 5 postmarketOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build postmarketOS for Nexus 5
    runs-on: ubuntu-24.04
    timeout-minutes: 330

    env:
      DEVICE: lg-hammerhead
      PMB_WORK: /home/runner/.local/var/pmbootstrap
      PMB_APORTS: /home/runner/pmaports
      PMB_CONFIG: /home/runner/.config/pmbootstrap_v3.cfg
      EXPORT_DIR: /home/runner/postmarketos-export

    steps:
      # --------------------------------------------------
      # 1. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            python3 \
            openssl \
            ca-certificates \
            qemu-user-static \
            binfmt-support \
            xz-utils \
            zip \
            unzip \
            file \
            rsync

      # --------------------------------------------------
      # 2. Install pmbootstrap
      # --------------------------------------------------
      - name: Install pmbootstrap
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth=1 \
            https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git \
            "$HOME/pmbootstrap"

          mkdir -p "$HOME/.local/bin"

          ln -s \
            "$HOME/pmbootstrap/pmbootstrap.py" \
            "$HOME/.local/bin/pmbootstrap"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          "$HOME/.local/bin/pmbootstrap" --version

      # --------------------------------------------------
      # 3. Clone pmaports
      # --------------------------------------------------
      - name: Clone pmaports
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth=1 \
            https://gitlab.postmarketos.org/postmarketOS/pmaports.git \
            "$PMB_APORTS"

          echo "=== pmaports branch ==="
          git -C "$PMB_APORTS" branch --show-current

          echo "=== pmaports revision ==="
          git -C "$PMB_APORTS" rev-parse HEAD

      # --------------------------------------------------
      # 4. Check device support
      # --------------------------------------------------
      - name: Check Nexus 5 device support
        shell: bash
        run: |
          set -euo pipefail

          DEVICE_DIR="$PMB_APORTS/device/testing/device-$DEVICE"

          test -f "$DEVICE_DIR/APKBUILD"
          test -f "$DEVICE_DIR/deviceinfo"

          echo "=== Device package ==="

          grep -E \
            '^(pkgname|pkgver|arch|depends)=' \
            "$DEVICE_DIR/APKBUILD"

          echo "=== Device information ==="

          cat "$DEVICE_DIR/deviceinfo"

      # --------------------------------------------------
      # 5. Initialize pmbootstrap
      # --------------------------------------------------
      - name: Initialize pmbootstrap
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$(dirname "$PMB_CONFIG")"

          # A fresh runner should not have an existing work dir.
          # Do not manually create this directory.
          if [ -e "$PMB_WORK" ]; then
            echo "Removing stale pmbootstrap work directory"
            sudo rm -rf "$PMB_WORK"
          fi

          # Preconfigure pmbootstrap before init.
          cat > "$PMB_CONFIG" <<EOF
          [pmbootstrap]
          aports = $PMB_APORTS
          work = $PMB_WORK
          device = $DEVICE
          ui = none
          user = user
          hostname = nexus5
          timezone = UTC
          build_default_device_arch = armv7
          is_default_channel = False
          EOF

          echo "=== Configuration ==="
          cat "$PMB_CONFIG"

          echo "=== pmbootstrap init ==="

          # Feed default answers if init requests input.
          # pipefail is temporarily disabled because printf may
          # receive SIGPIPE after pmbootstrap exits successfully.
          set +o pipefail

          printf '\n%.0s' {1..100} | \
            timeout 180 \
            pmbootstrap \
              --config "$PMB_CONFIG" \
              --aports "$PMB_APORTS" \
              --work "$PMB_WORK" \
              --details-to-stdout \
              init

          result=${PIPESTATUS[1]}

          set -o pipefail

          if [ "$result" -ne 0 ]; then
            echo "::error::pmbootstrap init failed with exit code $result"
            exit "$result"
          fi

          echo "=== Work directory ==="

          ls -la "$PMB_WORK"

          echo "=== Final configuration ==="

          cat "$PMB_CONFIG"

      # --------------------------------------------------
      # 6. Verify configuration
      # --------------------------------------------------
      - name: Verify pmbootstrap configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "=== pmbootstrap version ==="
          pmbootstrap --version

          echo "=== pmbootstrap status ==="

          pmbootstrap \
            --config "$PMB_CONFIG" \
            --details-to-stdout \
            status

          echo "=== Verify device ==="

          grep -E \
            '^(device|ui|aports|work) *=' \
            "$PMB_CONFIG"

          if ! grep -Eq '^device *= *lg-hammerhead *$' "$PMB_CONFIG"; then
            echo "::error::Unexpected device configuration"
            exit 1
          fi

      # --------------------------------------------------
      # 7. Build Recovery ZIP
      # --------------------------------------------------
      - name: Build TWRP Recovery ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Building postmarketOS ==="

          pmbootstrap \
            --config "$PMB_CONFIG" \
            --details-to-stdout \
            --timeout 3600 \
            --assume-yes \
            install \
            --android-recovery-zip \
            --password postmarketos

      # --------------------------------------------------
      # 8. Export build
      # --------------------------------------------------
      - name: Export ROM
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$EXPORT_DIR"

          pmbootstrap \
            --config "$PMB_CONFIG" \
            --details-to-stdout \
            export "$EXPORT_DIR"

          echo "=== Exported files ==="

          find "$EXPORT_DIR" \
            -maxdepth 3 \
            -type f \
            -printf '%p (%s bytes)\n'

          echo "=== Find Recovery ZIP ==="

          ZIP_FILE=$(find "$EXPORT_DIR" \
            -type f \
            -iname '*.zip' \
            -print \
            -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Recovery ZIP not found"
            exit 1
          fi

          echo "Recovery ZIP: $ZIP_FILE"

          echo "=== Verify ZIP ==="

          unzip -t "$ZIP_FILE"

          echo "=== ZIP contents ==="

          unzip -l "$ZIP_FILE" | head -80 || true

          echo "=== SHA256 ==="

          sha256sum "$ZIP_FILE" \
            | tee "$EXPORT_DIR/SHA256SUMS.txt"

      # --------------------------------------------------
      # 9. Upload ROM
      # --------------------------------------------------
      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: postmarketos-lg-hammerhead-twrp
          path: ${{ env.EXPORT_DIR }}/
          retention-days: 14
          if-no-files-found: error

      # --------------------------------------------------
      # 10. Upload debug logs on failure
      # --------------------------------------------------
      - name: Upload debug logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pmbootstrap-debug-logs
          path: |
            /home/runner/.local/var/pmbootstrap/log.txt
            /home/runner/.local/var/pmbootstrap/logs/
            /home/runner/.config/pmbootstrap_v3.cfg
          retention-days: 7
          if-no-files-found: ignore
